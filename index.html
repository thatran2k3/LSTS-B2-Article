<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Island: Digital Question Deck</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --danger: #EF4444;
            --bg: #F3F4F6;
            --text: #1F2937;
            --explanation-bg: #FFFBEB;
            --explanation-border: #F59E0B;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px;}
        p.subtitle { text-align: center; color: #6B7280; margin-bottom: 30px;}
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .num-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 0;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .num-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #4338CA;
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        .num-btn:disabled {
            background-color: #D1D5DB;
            color: #9CA3AF;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .question-display {
            font-size: 1.5rem;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 500;
        }

        .answer-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--secondary);
            margin-bottom: 15px;
            display: none;
            min-height: 40px;
        }

        .explanation-box {
            display: none;
            background-color: var(--explanation-bg);
            border-left: 5px solid var(--explanation-border);
            padding: 15px;
            text-align: left;
            border-radius: 4px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            color: #4B5563;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .action-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        .action-btn:hover { background-color: #059669; }
        
        .close-btn {
            background-color: #6B7280;
        }
        .close-btn:hover { background-color: #4B5563; }

    </style>
</head>
<body>

    <h1>Articles</h1>
    <p class="subtitle">Pick a number, guess the answer, and check if you're correct.</p>

    <div class="grid-container" id="number-grid">
        <!-- Numbers will be generated by JavaScript here -->
    </div>

    <!-- The Pop-up Modal -->
    <div class="modal-overlay" id="question-modal">
        <div class="modal-content">
            <div class="question-display" id="modal-question">Loading...</div>
            <div class="answer-display" id="modal-answer">Answer here</div>
            
            <!-- NEW: Explanation Box -->
            <div class="explanation-box" id="modal-explanation"></div>
            
            <button class="action-btn" id="reveal-btn" onclick="revealAnswer()">Reveal Answer</button>
            <button class="action-btn close-btn" id="close-btn" onclick="closeModal()" style="display:none;">Close & Return to Board</button>
        </div>
    </div>

    <script>
        // 25 Questions with Answers and Explanations
        const questions = [
            { 
                q: "I recently read ___ report about personality tests.", 
                a: "a", 
                e: "We use 'a/an' with singular countable nouns when we mention something for the first time."
            },
            { 
                q: "It was one of ___ worst decisions I've ever made.", 
                a: "the", 
                e: "We use 'the' with superlative adjectives (worst, best, most)."
            },
            { 
                q: "Have you ever taken ___ online psychology test?", 
                a: "an", 
                e: "We use 'a/an' for first mentions of singular countable nouns. We use 'an' because 'online' starts with a vowel sound."
            },
            { 
                q: "He really likes doing ___ puzzles.", 
                a: "(No Article)", 
                e: "We do not use an article with plural countable nouns when talking about things in general."
            },
            { 
                q: "I think that ___ idea that you can decide your job based on personality is silly.", 
                a: "the", 
                e: "We use 'the' to talk about a specific idea (the idea that you can decide...)."
            },
            { 
                q: "I've never understood why ___ people read horoscopes.", 
                a: "(No Article)", 
                e: "We do not use an article with plural countable nouns (people) when making general statements."
            },
            { 
                q: "I bought ___ laptop yesterday.", 
                a: "a", 
                e: "We use 'a/an' to mention something for the first time."
            },
            { 
                q: "I bought a laptop. ___ laptop is very fast.", 
                a: "the", 
                e: "We use 'the' to refer to something previously mentioned."
            },
            { 
                q: "She is ___ engineer.", 
                a: "an", 
                e: "We use 'a/an' to say what somebody's profession is. 'Engineer' starts with a vowel sound."
            },
            { 
                q: "___ scientists say that animals have complex brains.", 
                a: "(No Article)", 
                e: "We do not use an article with plural countable nouns (scientists) when making general statements."
            },
            { 
                q: "He was ___ first person to arrive.", 
                a: "the", 
                e: "We use 'the' with 'first' and 'last'."
            },
            { 
                q: "___ Sun is at the center of our solar system.", 
                a: "the", 
                e: "We use 'the' to talk about something unique (there is only one Sun)."
            },
            { 
                q: "I love reading about ___ history.", 
                a: "(No Article)", 
                e: "We do not use an article with uncountable nouns (history) when talking generally."
            },
            { 
                q: "My brother is ___ artist.", 
                a: "an", 
                e: "We use 'a/an' to state a profession. 'Artist' starts with a vowel sound."
            },
            { 
                q: "We need to talk to ___ government about this.", 
                a: "the", 
                e: "We use 'the' to talk about something unique (the government of a particular country)."
            },
            { 
                q: "We saw ___ stray dog on our walk.", 
                a: "a", 
                e: "We use 'a/an' for the first mention of a singular countable noun."
            },
            { 
                q: "The stray dog followed us home. ___ dog was very friendly.", 
                a: "the", 
                e: "We use 'the' to refer to a specific person or thing mentioned before (the stray dog)."
            },
            { 
                q: "He is looking for ___ new job.", 
                a: "a", 
                e: "We use 'a/an' to mention one of a number of things (one job out of many)."
            },
            { 
                q: "___ doctors recommend eating fresh vegetables.", 
                a: "(No Article)", 
                e: "We do not use an article with plural countable nouns (doctors) for general statements."
            },
            { 
                q: "Look at ___ man standing by the door.", 
                a: "the", 
                e: "We use 'the' to talk about a specific person (the man by the door)."
            },
            { 
                q: "Neil Armstrong was ___ first person on the moon.", 
                a: "the", 
                e: "We use 'the' with 'first' and 'last'."
            },
            { 
                q: "I don't usually like ___ coffee.", 
                a: "(No Article)", 
                e: "We do not use an article with uncountable nouns (coffee) when talking generally."
            },
            { 
                q: "___ coffee they serve here is delicious.", 
                a: "the", 
                e: "We use 'the' to talk about specific things (the coffee they serve here)."
            },
            { 
                q: "We didn't separate ___ art and ___ science.", 
                a: "(No Article) / (No Article)", 
                e: "We do not use an article with uncountable nouns (art, science) when talking generally."
            },
            { 
                q: "Did you lock ___ front door?", 
                a: "the", 
                e: "We use 'the' to talk about a specific thing (the door of the house we are in)."
            }
        ];

        let currentQuestionIndex = -1;

        // Initialize the grid on page load
        window.onload = () => {
            const grid = document.getElementById('number-grid');
            for (let i = 0; i < questions.length; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                btn.innerText = i + 1;
                btn.id = `btn-${i}`;
                btn.onclick = () => openQuestion(i);
                grid.appendChild(btn);
            }
        };

        function openQuestion(index) {
            currentQuestionIndex = index;
            const qData = questions[index];
            
            // Set text content
            document.getElementById('modal-question').innerText = qData.q;
            
            // Handle cases where there might be two blanks
            let answerText = qData.a;
            if (answerText.includes('/')) {
                document.getElementById('modal-answer').innerHTML = answerText.split('/').map(a => `<span style="color:#10B981">${a}</span>`).join(' / ');
            } else {
                document.getElementById('modal-answer').innerText = answerText;
            }

            // Set Explanation Text
            document.getElementById('modal-explanation').innerText = qData.e;

            // Reset modal state
            document.getElementById('modal-answer').style.display = 'none';
            document.getElementById('modal-explanation').style.display = 'none';
            document.getElementById('reveal-btn').style.display = 'block';
            document.getElementById('close-btn').style.display = 'none';

            // Show modal
            document.getElementById('question-modal').style.display = 'flex';
        }

        function revealAnswer() {
            document.getElementById('modal-answer').style.display = 'block';
            document.getElementById('modal-explanation').style.display = 'block'; // Show explanation
            document.getElementById('reveal-btn').style.display = 'none';
            document.getElementById('close-btn').style.display = 'block';
        }

        function closeModal() {
            // Hide modal
            document.getElementById('question-modal').style.display = 'none';
            
            // Disable the button on the grid and change its style
            const btn = document.getElementById(`btn-${currentQuestionIndex}`);
            btn.disabled = true;
            btn.innerText = "✓"; // Change text to a checkmark
        }
    </script>
</body>
</html>
